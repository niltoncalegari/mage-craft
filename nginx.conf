server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nothing here accepts uploads; the largest body is a match report.
  client_max_body_size 256k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Container-level liveness, answered without touching the SPA (compose healthcheck).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints these, so a stale copy can never be the wrong build.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must not be cached, or a deploy ships new assets behind an old
  # document that never references them.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Accounts/ranking/match-log API (api/) — same-origin, see src/net/ApiClient.ts.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Authoritative game server WebSocket (server/, Node — see server/README.md).
  location /ws {
    proxy_pass http://gameserver:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A match outlives any sane idle timeout, and the protocol has no keepalive
    # ping of its own — a snapshot only flows while a match is running.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
