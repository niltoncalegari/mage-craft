name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA to deploy (blank = this commit). Use to roll back.'
        required: false
        type: string

# Never cancel a deploy midway — a half-applied stack is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # The client and the game server both build from the repo root: the
          # server bundles the shared sim/ and public/maps/ (see server/Dockerfile).
          - image: client
            context: .
            dockerfile: Dockerfile
          - image: gameserver
            context: .
            dockerfile: server/Dockerfile
          - image: api
            context: ./api
            dockerfile: ./api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          # Layer cache in the registry: npm ci is the slow step and it only
          # changes when a lockfile does.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache,mode=max

  deploy:
    name: deploy on VPS runner
    needs: build
    # Runs on the VPS itself (see DEPLOY.md — a self-hosted runner registered
    # for this repo only, under its own OS user with docker-group-only
    # privileges). No SSH, no VPS credentials in GitHub: the job already has a
    # local docker socket, so "deploy" is just "pull the new tag and restart".
    runs-on: [self-hosted, mage-craft]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Pull and restart
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          # /opt/mage-craft/.env holds the application secrets (JWT_SECRET,
          # MATCH_INGEST_API_KEY, ...) and lives only on this box — never in the
          # repo, never in a GitHub secret. See DEPLOY.md.
          test -f /opt/mage-craft/.env || { echo "missing /opt/mage-craft/.env — see DEPLOY.md" >&2; exit 1; }
          COMPOSE="docker compose --env-file /opt/mage-craft/.env -f docker-compose.prod.yml -p mage-craft"
          $COMPOSE pull
          $COMPOSE up -d --remove-orphans
          # Keep a week of images so a rollback has something to pull locally.
          docker image prune -f --filter until=168h
          $COMPOSE ps

      - name: Verify the deploy is live
        run: |
          set -euo pipefail
          port=$(sed -n 's/^CLIENT_PORT=//p' /opt/mage-craft/.env | tail -1 | tr -d '"'\''[:space:]')
          port=${port:-8080}
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1; then
              echo "client healthy on :${port}"
              curl -fsS "http://127.0.0.1:${port}/api/ranking?limit=1" >/dev/null \
                && echo "api reachable through nginx"
              exit 0
            fi
            sleep 2
          done
          echo "client never became healthy" >&2
          docker compose --env-file /opt/mage-craft/.env -f docker-compose.prod.yml -p mage-craft logs --tail 50
          exit 1
