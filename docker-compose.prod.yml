# Production stack for the VPS. Pulls prebuilt images instead of building.
#
# docker-compose.yml builds from source, which needs the repo, a toolchain and
# ~2 GB of RAM on the host — the part most likely to fall over on a small VPS.
# Here CI does the building (.github/workflows/deploy.yml) and the host only
# pulls, so a deploy is a download and a restart.
#
# This is the only file the VPS needs besides its own .env; there is no clone of
# the source on the server. The deploy job copies it to /opt/mage-craft.
#
#   IMAGE_TAG pins the exact commit being run. The deploy job always sets it, so
#   a rollback is `IMAGE_TAG=<old-sha> docker compose -f ... up -d`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY:-ghcr.io/niltoncalegari/mage-craft}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mage-craft}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MATCH_INGEST_API_KEY: ${MATCH_INGEST_API_KEY:?set MATCH_INGEST_API_KEY in .env}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gameserver:
    image: ${REGISTRY:-ghcr.io/niltoncalegari/mage-craft}/gameserver:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    image: ${REGISTRY:-ghcr.io/niltoncalegari/mage-craft}/client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
      gameserver:
        condition: service_healthy
    ports:
      - '${CLIENT_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
