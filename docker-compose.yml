services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mage-craft}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MATCH_INGEST_API_KEY: ${MATCH_INGEST_API_KEY:?set MATCH_INGEST_API_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}

  gameserver:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 8080

  client:
    build: .
    restart: unless-stopped
    depends_on:
      - api
      - gameserver
    ports:
      - '${CLIENT_PORT:-8080}:80'

volumes:
  mongo-data:
